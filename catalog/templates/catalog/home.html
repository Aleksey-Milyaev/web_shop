{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block context %}
<div class="container">
    <div class="row text-center">
        {% for product in products %}
        <div class="col-3">
            <div class="card mb-4 box-shadow h-100">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                </div>
                <div class="card-body ">
                    <h1 class="card-title pricing-card-title">{{ product.price }}</h1>
                    <p class="card-title pricing-card-title">{{ product.descriptions| truncatechars:10}}</p>
                        <img src="{{ product.image | media_filter }}" style="width: 100%; height: 200px;">
                    <div class="btn-group" role="group" aria-label="Basic example">
                    <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
                    <a type="button" class="btn btn-lg btn-block btn-outline-primary" href="{% url 'catalog:product_detail' product.id %}">Посмотреть</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
